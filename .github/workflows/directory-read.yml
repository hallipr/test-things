name: Directory read authorization
run-name: Invocation ${{ inputs.invocation_id }}
on:
  workflow_dispatch:
    inputs:
      invocation_id:
        description: Invocation staged by the operator; requires an independently written run mapping
        required: true
        type: string
      expected_file:
        description: Relative file pre-uploaded by operator inside the authorized directory
        required: true
        default: probe.txt
        type: string
      expected_sha256:
        description: Optional SHA256 of expected_file, supplied by the upload script
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  directory-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROKER_URL: ${{ vars.DIRECTORY_BROKER_URL }}
      OIDC_AUDIENCE: ${{ vars.DIRECTORY_OIDC_AUDIENCE || 'api://hallipr-test-things-directory-access' }}
      EXPECTED_FILE: ${{ inputs.expected_file }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      INVOCATION_ID: ${{ inputs.invocation_id }}
    steps:
      - name: Validate broker configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BROKER_URL" == https://*/api/directory-access ]] || { echo "Set DIRECTORY_BROKER_URL repository variable"; exit 1; }
          echo "Run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT} requires an operator-written invocation mapping."
          echo "Waiting up to 10 minutes; this workflow cannot write authorization blobs."
      - name: Request OIDC grant and verify read/list and isolation
        shell: python
        run: |
          import base64, datetime, hashlib, json, os, pathlib, shlex, subprocess, tempfile, time, urllib.error, urllib.parse, urllib.request, uuid

          def request(url, method="GET", headers=None, data=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers or {}, method=method), timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          def mask(value):
              # Workflow commands must not interpret CR/LF/% in externally supplied text.
              value = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + value, flush=True)

          def dump_oidc_claims(token):
              header, payload, _ = token.split(".")
              for label, segment in (("header", header), ("payload", payload)):
                  decoded = json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))
                  print(f"::group::GitHub OIDC {label} (decoded, unverified; signature omitted)", flush=True)
                  print(json.dumps(decoded, indent=2, sort_keys=True), flush=True)
                  print("::endgroup::", flush=True)

          invocation = os.environ["INVOCATION_ID"]
          assert invocation.isascii() and invocation.isdecimal() and invocation == str(int(invocation))
          assert 1 <= int(invocation) <= 9223372036854775807
          broker = os.environ["BROKER_URL"].rstrip("/") + "/"
          deadline = time.monotonic() + 600
          grant = None
          claims_dumped = False
          while time.monotonic() < deadline:
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(os.environ["OIDC_AUDIENCE"], safe="")
              status, body = request(oidc_url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              if status != 200:
                  raise SystemExit("OIDC request failed (no response body logged)")
              token = json.loads(body)["value"]
              mask(token)
              if not claims_dumped:
                  dump_oidc_claims(token)
                  claims_dumped = True
              status, body = request(broker + invocation, method="POST", headers={"Authorization": "Bearer " + token}, data=b"")
              if status == 200:
                  grant = json.loads(body)
                  mask(grant["sasToken"])
                  break
              if status not in (403, 502, 503):
                  raise SystemExit(f"Broker rejected request: HTTP {status}")
              print(f"Waiting for operator authorization / RBAC propagation (HTTP {status})", flush=True)
              time.sleep(10)
          if grant is None:
              raise SystemExit("No authorization after 10 minutes")

          base = grant["directoryUrl"]
          sas = grant["sasToken"].lstrip("?")
          q = urllib.parse.parse_qs(sas)
          assert q["sr"] == ["d"] and q["sdd"] == ["1"] and q["sp"] == ["rl"] and q["spr"] == ["https"]
          dt = lambda x: datetime.datetime.fromisoformat(x.replace("Z", "+00:00"))
          assert (dt(q["se"][0]) - dt(q["st"][0])).total_seconds() == 3600
          path = urllib.parse.urlsplit(base)
          expected = f"/runs/{invocation}"
          assert path.path == expected
          for other in {"1", str(int(invocation) + 1)} - {invocation}:
              status, _ = request(broker + other, method="POST", headers={"Authorization": "Bearer " + token}, data=b"")
              assert status == 403, f"Broker accepted another invocation ID: HTTP {status}"
          status, mapping = request(base + "/.authorization.json?" + sas)
          assert status == 200
          assert json.loads(mapping) == {
              "invocationId": invocation, "repositoryId": os.environ["GITHUB_REPOSITORY_ID"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"]
          }

          # Recursive directory list through DFS; directory SAS covers descendants.
          account_base = f"{path.scheme}://{path.netloc}/runs"
          directory = path.path.removeprefix("/runs/")
          headers = {"x-ms-version": "2023-11-03"}
          paths, continuation, seen = [], "", set()
          while True:
              query = {"resource": "filesystem", "directory": directory, "recursive": "true"}
              if continuation:
                  query["continuation"] = continuation
              url = account_base + "?" + urllib.parse.urlencode(query) + "&" + sas
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  paths.extend(json.load(response)["paths"])
                  continuation = response.headers.get("x-ms-continuation", "")
              if not continuation:
                  break
              assert continuation not in seen, "Repeated listing continuation"
              seen.add(continuation)
          destination = pathlib.Path(tempfile.mkdtemp(prefix="run-input-", dir=os.environ["RUNNER_TEMP"]))
          downloaded = 0
          for entry in paths:
              if str(entry.get("isDirectory", "")).lower() == "true":
                  continue
              name = entry["name"]
              assert name.startswith(directory + "/"), "Listing escaped authorized directory"
              relative = name[len(directory) + 1:]
              if relative == ".authorization.json":
                  continue
              assert all(p not in ("", ".", "..") for p in relative.split("/"))
              target = destination.joinpath(*relative.split("/"))
              target.parent.mkdir(parents=True, exist_ok=True)
              status, content = request(base + "/" + urllib.parse.quote(relative, safe="/") + "?" + sas, headers=headers)
              assert status == 200, f"Authorized file read failed: HTTP {status}"
              target.write_bytes(content)
              downloaded += 1
          relative_file = os.environ["EXPECTED_FILE"]
          assert relative_file and all(p not in ("", ".", "..") for p in relative_file.split("/"))
          content = destination.joinpath(*relative_file.split("/")).read_bytes()
          digest = hashlib.sha256(content).hexdigest()
          if os.environ["EXPECTED_SHA256"]:
              assert digest == os.environ["EXPECTED_SHA256"].lower(), "Uploaded content hash mismatch"
          print(f"Consumed {downloaded} files in {destination}; {relative_file!r} SHA256 {digest}")

          cli_environment = os.environ.copy()
          for key in ("AZURE_STORAGE_KEY", "AZURE_STORAGE_CONNECTION_STRING", "AZURE_STORAGE_SERVICE_ENDPOINT"):
              cli_environment.pop(key, None)
          cli_environment["AZURE_STORAGE_SAS_TOKEN"] = sas
          account = path.hostname.split(".", 1)[0]
          cli_options = ["--account-name", account, "--file-system", "runs", "--auth-mode", "key", "--output", "json"]

          def run_az(arguments):
              command = ["az", "storage", "fs", "file"] + arguments + cli_options
              print("$ AZURE_STORAGE_SAS_TOKEN=<masked> " + shlex.join(command), flush=True)
              result = subprocess.run(command, env=cli_environment, capture_output=True, text=True)
              if result.stdout:
                  print(result.stdout, end="" if result.stdout.endswith("\n") else "\n", flush=True)
              if result.stderr:
                  print(result.stderr, end="" if result.stderr.endswith("\n") else "\n", flush=True)
              if result.returncode:
                  raise SystemExit(f"Azure CLI failed with exit code {result.returncode}")
              return result.stdout

          print("::group::Azure CLI directory contents and largest blob download", flush=True)
          cli_paths, marker, seen_markers = [], "", set()
          while True:
              arguments = ["list", "--path", directory, "--recursive", "true", "--num-results", "5000", "--show-next-marker"]
              if marker:
                  arguments += ["--marker", marker]
              page = json.loads(run_az(arguments))
              assert isinstance(page, list), "Unexpected Azure CLI listing shape"
              cli_paths.extend(item for item in page if "name" in item)
              markers = [item["nextMarker"] for item in page if "nextMarker" in item]
              assert len(markers) <= 1, "Ambiguous Azure CLI continuation"
              marker = markers[0] if markers else ""
              if not marker:
                  break
              assert marker not in seen_markers, "Repeated Azure CLI continuation"
              seen_markers.add(marker)
          assert {item["name"] for item in cli_paths} == {item["name"] for item in paths}, "CLI listing differs from REST listing"
          files = [item for item in cli_paths if str(item.get("isDirectory", "")).lower() != "true"]
          assert files, "No blobs available to download"
          largest = max(files, key=lambda item: (int(item["contentLength"]), item["name"]))
          assert largest["name"].startswith(directory + "/"), "Largest blob escaped invocation directory"
          print(f"Largest blob (including authorization metadata): {largest['name']!r}, {largest['contentLength']} bytes", flush=True)
          cli_destination = pathlib.Path(tempfile.mkdtemp(prefix="az-largest-", dir=os.environ["RUNNER_TEMP"])) / "downloaded-blob"
          run_az(["download", "--path", largest["name"], "--destination", str(cli_destination), "--overwrite", "false"])
          cli_content = cli_destination.read_bytes()
          assert len(cli_content) == int(largest["contentLength"]), "Azure CLI download size mismatch"
          relative_largest = largest["name"][len(directory) + 1:]
          expected_content = mapping if relative_largest == ".authorization.json" else destination.joinpath(*relative_largest.split("/")).read_bytes()
          assert cli_content == expected_content, "Azure CLI download differs from REST content"
          print(f"Azure CLI downloaded {len(cli_content)} bytes to {cli_destination}; SHA256 {hashlib.sha256(cli_content).hexdigest()}", flush=True)
          print("::endgroup::", flush=True)

          # A directory grant must not expose another invocation or the allocator.
          for sibling in (str(int(invocation) + 1), "_control"):
              status, _ = request(account_base + "/" + sibling + "/" + urllib.parse.quote(relative_file, safe="/") + "?" + sas, headers=headers)
              assert status == 403, f"Sibling read was not denied: HTTP {status}"
              query = urllib.parse.urlencode({"resource": "filesystem", "directory": sibling, "recursive": "true"})
              status, _ = request(account_base + "?" + query + "&" + sas, headers=headers)
              assert status == 403, f"Sibling list was not denied: HTTP {status}"
          # Random name avoids modifying a preexisting object if a regression permits write.
          status, _ = request(base + "/forbidden-write-" + uuid.uuid4().hex + "?resource=file&" + sas, method="PUT", headers=headers, data=b"")
          assert status == 403, f"Write was not denied: HTTP {status}"
          print("PASS: trusted invocation-to-run mapping, arbitrary invocation rejected, sibling/control read/list denied, write denied; exact 60-minute directory SAS.")
